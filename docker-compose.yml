services:
  luminex-bot:
    build: .
    container_name: luminex-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./croxydb:/usr/src/app/croxydb
      - ./data:/usr/src/app/data
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: luminex-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
